<!DOCTYPE html>
<html lang="th" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ส่งเสด็จสู่สวรรคาลัย</title>
    <style>
        body {
            box-sizing: border-box;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            height: 100%;
            font-family: 'Sarabun', sans-serif;
        }
        
        .container {
            min-height: 100%;
            background: linear-gradient(135deg, #000000 90%, #1a1a1a 100%);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }
        
        .thai-pattern {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.15;
            animation: float 8s ease-in-out infinite;
        }
        
        .thai-pattern-2 {
            position: absolute;
            top: 20%;
            right: 10%;
            width: 200px;
            height: 200px;
            opacity: 0.1;
            animation: rotate 15s linear infinite;
        }
        
        .thai-pattern-3 {
            position: absolute;
            bottom: 10%;
            left: 15%;
            width: 150px;
            height: 150px;
            opacity: 0.12;
            animation: pulse 6s ease-in-out infinite;
        }
        
        .center-content {
            text-align: center;
            z-index: 10;
            position: relative;
        }
        
        .title {
            color: #FFD700;
            font-size: 3rem;
            font-weight: 300;
            margin-bottom: 3rem;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
            animation: glow 3s ease-in-out infinite alternate;
        }
        
        .enter-button {
            background: linear-gradient(45deg, #FFD700, #FFA500);
            border: 2px solid #FFD700;
            color: #000;
            padding: 1rem 3rem;
            font-size: 1.2rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3);
            position: relative;
            overflow: hidden;
        }
        
        .enter-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 215, 0, 0.5);
            background: linear-gradient(45deg, #FFA500, #FFD700);
        }
        
        .enter-button:active {
            transform: translateY(0);
        }
        
        .enter-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }
        
        .enter-button:hover::before {
            left: 100%;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(2deg); }
        }
        
        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.12; }
            50% { transform: scale(1.1); opacity: 0.2; }
        }
        
        @keyframes glow {
            0% { text-shadow: 0 0 20px rgba(255, 215, 0, 0.3); }
            100% { text-shadow: 0 0 30px rgba(255, 215, 0, 0.6), 0 0 40px rgba(255, 215, 0, 0.4); }
        }
        
        @media (max-width: 768px) {
            .title {
                font-size: 2rem;
                margin-bottom: 2rem;
            }
            
            .enter-button {
                padding: 0.8rem 2rem;
                font-size: 1rem;
            }
            
            .thai-pattern-2, .thai-pattern-3 {
                width: 100px;
                height: 100px;
            }
        }
    </style>
</head>
<body>
    <main class="container">
        <!-- ลายกนกไทยแบบที่ 1 -->
        <svg class="thai-pattern" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <pattern id="kanokPattern" x="0" y="0" width="120" height="120" patternUnits="userSpaceOnUse">
                    <!-- ลายกนกหลัก -->
                    <path d="M60 20 C80 15, 95 25, 100 45 C95 65, 80 75, 60 70 C50 75, 40 85, 35 100 C30 85, 25 70, 35 55 C45 40, 55 25, 60 20 Z" 
                          fill="none" stroke="#FFD700" stroke-width="1.5" opacity="0.8"/>
                    <!-- หางกนก -->
                    <path d="M35 100 C25 105, 15 110, 10 120 C15 115, 25 110, 35 105" 
                          fill="none" stroke="#FFD700" stroke-width="1" opacity="0.6"/>
                    <!-- ปีกกนก -->
                    <path d="M60 45 C70 40, 80 45, 85 55 C80 50, 70 50, 60 55" 
                          fill="#FFD700" opacity="0.3"/>
                    <!-- ลายประกอบ -->
                    <circle cx="90" cy="30" r="3" fill="#FFD700" opacity="0.4"/>
                    <circle cx="30" cy="90" r="2" fill="#FFD700" opacity="0.5"/>
                </pattern>
            </defs>
            <rect width="100%" height="100%" fill="url(#kanokPattern)"/>
        </svg>
        
        <!-- ลายกนกไทยแบบที่ 2 -->
        <svg class="thai-pattern-2" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <!-- กนกใหญ่ -->
            <path d="M100 30 C130 20, 160 40, 170 80 C160 120, 130 140, 100 130 C80 140, 60 150, 40 170 C30 150, 25 120, 40 90 C60 60, 80 40, 100 30 Z" 
                  fill="none" stroke="#FFD700" stroke-width="2.5" opacity="0.7"/>
            <!-- หางกนกยาว -->
            <path d="M40 170 C20 180, 10 190, 5 200 C15 195, 30 185, 45 175" 
                  fill="none" stroke="#FFD700" stroke-width="2" opacity="0.6"/>
            <!-- ปีกกนกใหญ่ -->
            <path d="M100 70 C120 60, 140 70, 150 90 C140 80, 120 80, 100 90" 
                  fill="#FFD700" opacity="0.25"/>
            <!-- ลายเส้นประกอบ -->
            <path d="M80 50 C90 45, 100 50, 105 60" fill="none" stroke="#FFD700" stroke-width="1" opacity="0.5"/>
        </svg>
        
        <!-- ลายกนกไทยแบบที่ 3 -->
        <svg class="thai-pattern-3" viewBox="0 0 150 150" xmlns="http://www.w3.org/2000/svg">
            <!-- กนกเล็ก -->
            <path d="M75 25 C90 20, 105 30, 110 50 C105 70, 90 80, 75 75 C65 80, 55 85, 45 95 C40 85, 35 70, 45 55 C55 40, 65 30, 75 25 Z" 
                  fill="none" stroke="#FFD700" stroke-width="1.8" opacity="0.8"/>
            <!-- หางกนกเล็ก -->
            <path d="M45 95 C35 100, 25 105, 20 115 C25 110, 35 105, 45 100" 
                  fill="none" stroke="#FFD700" stroke-width="1.5" opacity="0.6"/>
            <!-- ปีกกนกเล็ก -->
            <path d="M75 50 C85 45, 95 50, 100 60 C95 55, 85 55, 75 60" 
                  fill="#FFD700" opacity="0.3"/>
            <!-- ดอกไม้ประกอบ -->
            <circle cx="110" cy="40" r="4" fill="none" stroke="#FFD700" stroke-width="1" opacity="0.4"/>
            <path d="M106 40 L114 40 M110 36 L110 44" stroke="#FFD700" stroke-width="0.8" opacity="0.4"/>
        </svg>
        
      <div class="center-content">
          <h1 class="title"><img src="assets/img/สีดำ สีทอง หรูหรา ไว้อาลัย งานศพ Facebook โพสต์   .png" width="85%" ></h1>
      </div>
      <div class="enter-button"><a href="index1.html"><img src="assets/img/welcome.png" width="212" height="63"></a> </div>
    </main>
    
    <script>
        function enterWebsite() {
            // เอฟเฟกต์เมื่อคลิกปุ่ม
            const button = document.querySelector('.enter-button');
            button.style.transform = 'scale(0.95)';
            
            setTimeout(() => {
                button.style.transform = 'scale(1)';
                // ที่นี่คุณสามารถเพิ่มการนำทางไปยังหน้าอื่นได้
                alert('ยินดีต้อนรับสู่เว็บไซต์!');
            }, 150);
        }
        
        // เพิ่มเอฟเฟกต์การเคลื่อนไหวเมื่อโหลดหน้า
        window.addEventListener('load', () => {
            const title = document.querySelector('.title');
            const button = document.querySelector('.enter-button');
            
            title.style.opacity = '0';
            button.style.opacity = '0';
            title.style.transform = 'translateY(30px)';
            button.style.transform = 'translateY(30px)';
            
            setTimeout(() => {
                title.style.transition = 'all 1s ease';
                title.style.opacity = '1';
                title.style.transform = 'translateY(0)';
            }, 300);
            
            setTimeout(() => {
                button.style.transition = 'all 1s ease';
                button.style.opacity = '1';
                button.style.transform = 'translateY(0)';
            }, 600);
        });
    </script>

</html>
